# Local quant data layer for the MT5 bot (Postgres + Redis).
#
# Ports are deliberately NOT the defaults: 5432/6379 belong to the unrelated
# poly-trader stack on this machine. Both services bind to 127.0.0.1 only.
#
# Levantar datos:  docker compose --env-file .env -f infra/docker-compose.yml up -d
#   o:  make up
# El minero de ordenes manuales NO va en este compose: MetaTrader 5 es un
# proceso de Windows. Levantarlo en el host, aparte del bot:
#   py manual_miner_daemon.py
#   make miner
# Bajar:
#   docker compose --env-file .env -f infra/docker-compose.yml down
#
# schema.sql solo corre automaticamente la primera vez (volumen vacio).
# Para reaplicarlo (es idempotente):
#   docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
#     psql -U "$env:MT5_PG_USER" -d "$env:MT5_PG_DB" < infra/schema.sql

name: meta-trader

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MT5_PG_USER:-metatrader}
      POSTGRES_PASSWORD: ${MT5_PG_PASSWORD:?MT5_PG_PASSWORD must be set in .env}
      POSTGRES_DB: ${MT5_PG_DB:-metatrader}
      # Deterministic partition-name math regardless of host locale.
      PGTZ: UTC
      TZ: UTC
    ports:
      - "127.0.0.1:${MT5_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    # synchronous_commit=off trades the last few ms of committed writes on a
    # hard crash for a large gain on tick ingest throughput. Acceptable here:
    # ticks are ephemeral (48h TTL) and trades.log stays the audit source of truth.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - timezone=UTC
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${MT5_PG_USER:-metatrader}" -d "${MT5_PG_DB:-metatrader}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MT5_REDIS_PORT:-6380}:6379"
    # No persistence: Redis is a live fan-out bus, Postgres is the store.
    # noeviction so a full buffer surfaces as a loud error instead of silently
    # dropping market data.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${MT5_REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
